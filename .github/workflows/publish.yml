name: Publish to PyPI

# Runs only when the owner publishes a GitHub release. Nothing else uploads.
# Pre-releases are skipped. The tagged commit must be on main and must have
# passed the CI check "Release readiness". The upload job waits in the "pypi"
# environment, where the owner is the required reviewer.
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Record checked revision
        run: echo "Checked revision $(git rev-parse HEAD)"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: The release tag names the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "tag $TAG, package version $version"
          test "$TAG" = "v$version"
      - name: The tagged commit is on main
        run: |
          git merge-base --is-ancestor HEAD origin/main
          echo "$(git rev-parse HEAD) is on origin/main"
      - name: Release readiness passed on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh api "repos/$GITHUB_REPOSITORY/commits/$(git rev-parse HEAD)/check-runs?check_name=Release+readiness" --jq '[.check_runs[] | select(.conclusion == "success")] | length')
          echo "successful Release readiness runs: $passed"
          test "$passed" -ge 1
      - name: Install pinned build and test tools
        run: python -m pip install -r requirements-ci.txt
      - name: Build source distribution and wheel from it
        run: python -m build --no-isolation
      - name: Install the built wheel, not the source tree
        run: python -m pip install --no-index --no-deps --force-reinstall dist/*.whl
      - name: Verify packaged tests and isolated CLI
        run: python scripts/verify_distribution.py --dist-dir dist
      - name: Record checksums
        run: sha256sum dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/agent-trace-gate/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - name: Checksums of the files about to be uploaded
        run: sha256sum dist/*
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
