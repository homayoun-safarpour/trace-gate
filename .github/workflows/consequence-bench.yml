name: Consequence bench evidence
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '37 6 * * *'
permissions:
  contents: read
jobs:
  verify:
    # Manual dispatch from arbitrary branches must not execute their code.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require exact trusted main ref
        run: |
          if [ "$GITHUB_REF" != 'refs/heads/main' ]; then
            mkdir -p reports/consequence-bench
            printf '{"passed":false,"verdict":"REF_NOT_TRUSTED","scope":"Not assessed; only exact refs/heads/main can execute this bench."}\n' > reports/consequence-bench/report.json
            printf '# Consequence bench\n\nNOT ASSESSED: ref is not exact trusted main.\n' > reports/consequence-bench/report.md
            cat reports/consequence-bench/report.md >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Run fixed-fixture regressions and report
        run: python -I scripts/verify_consequence_bench.py
      - name: Preserve verification evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: consequence-bench-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/consequence-bench/
          if-no-files-found: error
          retention-days: 14
