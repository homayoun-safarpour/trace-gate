<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 376" width="860" height="376" role="img" aria-label="Terminal demo: trace-gate blocks an agent run that called a forbidden tool with exit 2, and passes the approved run with exit 0">
<title>trace-gate demo: a run that called a forbidden tool is blocked (exit 2), the approved run passes (exit 0)</title>
<style>
.l{font-family:Consolas,Menlo,'DejaVu Sans Mono',monospace;font-size:13.5px;white-space:pre}
@keyframes a0{0%,2.22%{opacity:0}2.50%,96%{opacity:1}100%{opacity:0}}.l0{animation:a0 18.0s linear infinite}@keyframes t0{0%,2.22%{transform:scaleX(1)}11.11%,100%{transform:scaleX(0)}}.c0{transform-box:fill-box;transform-origin:right;animation:t0 18.0s steps(31,end) infinite}@keyframes a1{0%,11.11%{opacity:0}11.39%,96%{opacity:1}100%{opacity:0}}.l1{animation:a1 18.0s linear infinite}@keyframes t1{0%,11.11%{transform:scaleX(1)}20.00%,100%{transform:scaleX(0)}}.c1{transform-box:fill-box;transform-origin:right;animation:t1 18.0s steps(39,end) infinite}@keyframes a2{0%,22.22%{opacity:0}22.50%,96%{opacity:1}100%{opacity:0}}.l2{animation:a2 18.0s linear infinite}@keyframes a3{0%,23.89%{opacity:0}24.17%,96%{opacity:1}100%{opacity:0}}.l3{animation:a3 18.0s linear infinite}@keyframes a4{0%,25.56%{opacity:0}25.83%,96%{opacity:1}100%{opacity:0}}.l4{animation:a4 18.0s linear infinite}@keyframes a5{0%,25.56%{opacity:0}25.83%,96%{opacity:1}100%{opacity:0}}.l5{animation:a5 18.0s linear infinite}@keyframes a6{0%,29.44%{opacity:0}29.72%,96%{opacity:1}100%{opacity:0}}.l6{animation:a6 18.0s linear infinite}@keyframes a8{0%,45.56%{opacity:0}45.83%,96%{opacity:1}100%{opacity:0}}.l8{animation:a8 18.0s linear infinite}@keyframes t8{0%,45.56%{transform:scaleX(1)}53.89%,100%{transform:scaleX(0)}}.c8{transform-box:fill-box;transform-origin:right;animation:t8 18.0s steps(30,end) infinite}@keyframes a9{0%,53.89%{opacity:0}54.17%,96%{opacity:1}100%{opacity:0}}.l9{animation:a9 18.0s linear infinite}@keyframes t9{0%,53.89%{transform:scaleX(1)}62.22%,100%{transform:scaleX(0)}}.c9{transform-box:fill-box;transform-origin:right;animation:t9 18.0s steps(39,end) infinite}@keyframes a10{0%,64.44%{opacity:0}64.72%,96%{opacity:1}100%{opacity:0}}.l10{animation:a10 18.0s linear infinite}@keyframes a11{0%,66.11%{opacity:0}66.39%,96%{opacity:1}100%{opacity:0}}.l11{animation:a11 18.0s linear infinite}@keyframes a12{0%,67.78%{opacity:0}68.06%,96%{opacity:1}100%{opacity:0}}.l12{animation:a12 18.0s linear infinite}@keyframes a13{0%,71.67%{opacity:0}71.94%,96%{opacity:1}100%{opacity:0}}.l13{animation:a13 18.0s linear infinite}
@media (prefers-reduced-motion: reduce){.l{animation:none;opacity:1}.c{animation:none;transform:scaleX(0)}}
</style>
<rect width="860" height="376" rx="10" fill="#17211e"/>
<rect width="860" height="34" rx="10" fill="#20322b"/><rect y="24" width="860" height="10" fill="#20322b"/>
<circle cx="20" cy="17" r="5.5" fill="#e06c5a"/><circle cx="38" cy="17" r="5.5" fill="#e2b34a"/><circle cx="56" cy="17" r="5.5" fill="#5fbf7f"/>
<text x="430.0" y="22" text-anchor="middle" fill="#9fb0a6" font-family="system-ui,sans-serif" font-size="12">trace-gate: real commands, real output</text>
<text class="l l0" x="22" y="64" fill="#bce6c9" font-weight="400">$ trace-gate check examples/trajectories/support_regress.json \</text>
<rect class="c c0" x="20" y="49" width="518" height="21" fill="#17211e"/>
<text class="l l1" x="22" y="85" fill="#bce6c9" font-weight="400">    --rubric examples/rubric.json --baseline examples/baselines/support_v1.json</text>
<rect class="c c1" x="20" y="70" width="648" height="21" fill="#17211e"/>
<text class="l l2" x="22" y="106" fill="#f0a35e" font-weight="700">verdict: POLICY_VIOLATION</text>
<text class="l l3" x="22" y="127" fill="#9fb0a6" font-weight="400">  rubric_sha256 OK (1d90a2ae91e6...)</text>
<text class="l l4" x="22" y="148" fill="#e8efe9" font-weight="400">  support-agent-good: POLICY_VIOLATION forbidden_tools_used=[&#x27;delete_order&#x27;]</text>
<text class="l l5" x="22" y="169" fill="#e8efe9" font-weight="400">      (forbidden_tools=0.5000; tolerance does not apply)</text>
<text class="l l6" x="22" y="190" fill="#f0a35e" font-weight="700">exit 2   the agent called a forbidden tool, so the CI job fails</text>
<text class="l l8" x="22" y="232" fill="#bce6c9" font-weight="400">$ trace-gate check examples/trajectories/support_good.json \</text>
<rect class="c c8" x="20" y="217" width="494" height="21" fill="#17211e"/>
<text class="l l9" x="22" y="253" fill="#bce6c9" font-weight="400">    --rubric examples/rubric.json --baseline examples/baselines/support_v1.json</text>
<rect class="c c9" x="20" y="238" width="648" height="21" fill="#17211e"/>
<text class="l l10" x="22" y="274" fill="#6fd39b" font-weight="700">verdict: PASS</text>
<text class="l l11" x="22" y="295" fill="#9fb0a6" font-weight="400">  rubric_sha256 OK (1d90a2ae91e6...)</text>
<text class="l l12" x="22" y="316" fill="#e8efe9" font-weight="400">  support-agent-good: PASS composite=1.0000 &gt;= floor=0.9500 (pinned=1.0000)</text>
<text class="l l13" x="22" y="337" fill="#6fd39b" font-weight="700">exit 0   the approved behaviour holds, so the job continues</text>
</svg>
