name: "trace-gate"
description: "Fail the job when an AI agent's recorded run scores worse than its frozen baseline (exit 0 or 2)."
author: "Homayoun Safarpour"
branding:
  icon: "shield"
  color: "green"

inputs:
  trajectory:
    description: "Path to the recorded agent run (JSON) to check."
    required: true
  rubric:
    description: "Path to the reviewed rubric (JSON)."
    required: true
  baseline:
    description: "Path to the frozen baseline (JSON) written by `trace-gate freeze`."
    required: true
  python-version:
    description: "Python version used to run trace-gate."
    required: false
    default: "3.12"

outputs:
  verdict:
    description: "PASS, REGRESSION, RUBRIC_DRIFT, MISSING_BASELINE, UNKNOWN_TRAJECTORY, or ERROR."
    value: ${{ steps.check.outputs.verdict }}
  exit-code:
    description: "Exit code of `trace-gate check` (0 pass, 2 blocked)."
    value: ${{ steps.check.outputs.exit-code }}

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install trace-gate
      shell: bash
      env:
        TG_ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --quiet "$TG_ACTION_PATH"
    - name: Check the run against the baseline
      id: check
      shell: bash
      env:
        TG_TRAJECTORY: ${{ inputs.trajectory }}
        TG_RUBRIC: ${{ inputs.rubric }}
        TG_BASELINE: ${{ inputs.baseline }}
      run: |
        set +e
        out=$(trace-gate check "$TG_TRAJECTORY" --rubric "$TG_RUBRIC" --baseline "$TG_BASELINE" 2>&1)
        code=$?
        printf '%s\n' "$out"
        verdict=$(printf '%s\n' "$out" | sed -n 's/^verdict: //p' | head -n 1)
        verdict=${verdict:-ERROR}
        echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        {
          echo "### trace-gate: $verdict (exit $code)"
          echo
          echo '```text'
          printf '%s\n' "$out"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        exit "$code"
